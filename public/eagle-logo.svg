<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Outer 3D Gold Bevel Gradient -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="15%" stop-color="#fcf6ba" />
      <stop offset="35%" stop-color="#b38728" />
      <stop offset="65%" stop-color="#fbf5b7" />
      <stop offset="85%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#5a3d0b" />
    </linearGradient>

    <!-- Metallic Silver Platinum Gradient -->
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Deep Midnight Sapphire Radial Gradient -->
    <radialGradient id="navyMedallion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#071329" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>

    <!-- 3D Shadow -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Black Disc -->
  <circle cx="300" cy="300" r="290" fill="#000000" />

  <!-- Outer Platinum Silver Rim -->
  <circle cx="300" cy="300" r="280" fill="url(#silverBevel)" filter="url(#shadow3D)" />
  <circle cx="300" cy="300" r="268" fill="#000000" />

  <!-- Heavy Gold Embossed Ring -->
  <circle cx="300" cy="300" r="262" fill="url(#goldBevel)" filter="url(#shadow3D)" />
  <circle cx="300" cy="300" r="240" fill="#000000" />

  <!-- Inner Silver Beaded Ring -->
  <circle cx="300" cy="300" r="236" fill="url(#silverBevel)" />
  <circle cx="300" cy="300" r="226" fill="url(#navyMedallion)" />

  <!-- 3 Gold Stars at Top -->
  <!-- Top Center Star -->
  <polygon points="300,95 307,114 328,114 311,126 317,146 300,134 283,146 289,126 272,114 293,114" fill="url(#goldBevel)" filter="url(#shadow3D)" />
  <!-- Top Left Star -->
  <polygon points="248,118 253,132 268,132 256,141 261,155 248,146 235,155 240,141 228,132 243,132" fill="url(#goldBevel)" />
  <!-- Top Right Star -->
  <polygon points="352,118 357,132 372,132 360,141 365,155 352,146 339,155 344,141 332,132 347,132" fill="url(#goldBevel)" />

  <!-- Majestic Eagle with Wide Outstretched Silver & Gold Wings -->
  <g id="eagleFigure" filter="url(#shadow3D)">
    <!-- Golden Wing Base / Tips -->
    <path d="M 130 250 C 90 180 150 140 220 160 C 180 190 190 230 220 250 Z" fill="url(#goldBevel)" />
    <path d="M 470 250 C 510 180 450 140 380 160 C 420 190 410 230 380 250 Z" fill="url(#goldBevel)" />

    <!-- Platinum Wing Feathers (Left Wing) -->
    <path d="M 300 240 C 230 170 140 150 75 200 C 100 235 140 270 190 295 C 160 270 190 245 240 255 Z" fill="url(#silverBevel)" />
    <path d="M 300 255 C 245 205 165 195 110 240 C 135 270 180 300 225 315 Z" fill="url(#silverBevel)" opacity="0.9" />
    <path d="M 300 270 C 260 230 185 230 145 270 C 175 295 220 320 260 330 Z" fill="url(#silverBevel)" opacity="0.85" />

    <!-- Platinum Wing Feathers (Right Wing) -->
    <path d="M 300 240 C 370 170 460 150 525 200 C 500 235 460 270 410 295 C 440 270 410 245 360 255 Z" fill="url(#silverBevel)" />
    <path d="M 300 255 C 355 205 435 195 490 240 C 465 270 420 300 375 315 Z" fill="url(#silverBevel)" opacity="0.9" />
    <path d="M 300 270 C 340 230 415 230 455 270 C 425 295 380 320 340 330 Z" fill="url(#silverBevel)" opacity="0.85" />

    <!-- Eagle Body Feathers -->
    <path d="M 260 240 C 275 290 270 330 250 360 C 280 375 320 375 350 360 C 330 330 325 290 340 240 Z" fill="url(#silverBevel)" />

    <!-- Eagle Head (Pure White Crown with Gold Beak) -->
    <path d="M 300 170 C 278 170 260 185 260 210 C 260 235 280 255 300 260 C 320 255 340 235 340 210 C 340 185 322 170 300 170 Z" fill="#ffffff" />
    
    <!-- Eagle Eye (Gold & Black Pupil) -->
    <circle cx="284" cy="202" r="5" fill="#f59e0b" />
    <circle cx="284" cy="202" r="2.5" fill="#000000" />
    <path d="M 276 195 C 284 195 292 198 296 202" stroke="#000000" stroke-width="2.5" fill="none" />

    <!-- Sharp Golden Beak -->
    <path d="M 266 202 C 240 205 230 225 236 240 C 248 230 262 225 268 225 Z" fill="url(#goldBevel)" />

    <!-- Powerful Golden Talons / Claws -->
    <path d="M 248 360 C 242 385 254 398 266 392 C 260 380 266 368 272 360 Z" fill="url(#goldBevel)" />
    <path d="M 328 360 C 322 368 328 380 322 392 C 334 398 346 385 340 360 Z" fill="url(#goldBevel)" />
  </g>

  <!-- 3D Embossed Bold Word: "EAGLE" -->
  <g filter="url(#shadow3D)">
    <text x="300" y="445" font-family="'Times New Roman', 'Playfair Display', Georgia, serif" font-size="88" font-weight="900" text-anchor="middle" letter-spacing="6" fill="url(#silverBevel)" stroke="#ffffff" stroke-width="2">
      EAGLE
    </text>
  </g>

  <!-- Divider Ribbon Lines with "SILVERS" -->
  <g filter="url(#shadow3D)">
    <line x1="85" y1="472" x2="190" y2="472" stroke="url(#silverBevel)" stroke-width="3.5" />
    <text x="300" y="480" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="10" fill="url(#silverBevel)">
      SILVERS
    </text>
    <line x1="410" y1="472" x2="515" y2="472" stroke="url(#silverBevel)" stroke-width="3.5" />
  </g>

  <!-- 3D Embossed Gold: "WHOLE SALE" -->
  <g filter="url(#shadow3D)">
    <text x="300" y="522" font-family="'Times New Roman', 'Playfair Display', Georgia, serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="8" fill="url(#goldBevel)">
      WHOLE SALE
    </text>
  </g>

  <!-- Bottom Blue Gem Diamond with Gold Filigree Scroll -->
  <g transform="translate(300, 555) scale(1.1)" filter="url(#shadow3D)">
    <!-- Filigree Swirls -->
    <path d="M -50 -6 C -30 -25 -12 6 0 0 C 12 6 30 -25 50 -6" stroke="url(#silverBevel)" stroke-width="3" fill="none" />
    <!-- Gold Diamond Outer Box -->
    <polygon points="0,-22 20,0 0,22 -20,0" fill="url(#goldBevel)" />
    <!-- Blue Gem Facets -->
    <polygon points="0,-15 14,0 0,15 -14,0" fill="#0284c7" />
    <polygon points="0,-10 9,0 0,10 -9,0" fill="#38bdf8" />
  </g>
</svg>
